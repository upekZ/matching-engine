syntax = "proto3";

package grpc;

option go_package = "grpc";

service OrderService {
  rpc PlaceNewOrder (OrderRequest) returns (OrderResponse);
  rpc SubscribeOrderUpdates (MarketRequest) returns (stream ExecReport);
}

message OrderRequest {
  string client_id = 1;
  string symbol = 2;
  string side = 3;
  float price = 4;
  int32 quantity = 5;
  string type = 6;
}

message OrderResponse {
  string order_id = 1;
  enum OrderStatus {
    PENDING = 0;
    CONFIRMED = 1;
    FAILED = 2;
  }
  OrderStatus status = 2;
}

message MarketRequest {
  string market = 1;
}

message ExecReport {
  map<string, TradeList> exec_report = 1;
}

message Trade {
  string id = 1;
  string status = 2;
  string symbol = 3;
  float price = 4;
  float order_price = 5;
  int32 quantity = 6;
  int32 cum_quantity = 7;
  string client_id = 8;
  string action = 9;
  string side = 10;
  int64 timestamp = 11;
  string order_id = 12;
}

message TradeList {
  repeated Trade trade = 1;
}