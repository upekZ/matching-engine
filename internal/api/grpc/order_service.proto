syntax = "proto3";

package grpc;

option go_package = "grpc";

service OrderService {
  rpc PlaceNewOrder (OrderRequest) returns (OrderResponse);
  rpc SubscribeOrderUpdates (MarketRequest) returns (stream ExecReport);
}

message OrderRequest {
  string client_id = 1;
  string symbol = 2;
  string side = 3;
  float price = 4;
  int32 quantity = 5;
  string type = 6;
}

message OrderResponse {
  string order_id = 1;               // Unique identifier for the order
  enum OrderStatus {
    PENDING = 0;                     // Order is received but not yet processed
    CONFIRMED = 1;                   // Order is confirmed
    FAILED = 2;                      // Order placement failed
  }
  OrderStatus status = 2;
}

message MarketRequest {
  string market = 1;
}

message ExecReport {
  map<string, TradeList> exec_report = 1;
}

message Trade {
  string id = 1;
  string status = 2;
  string symbol = 3;
  float price = 4;
  int32 quantity = 5;
  int32 cum_quantity = 6;
  string client_id = 7;
  string action = 8;
  string side = 9;
  int64 timestamp = 10;
  string order_id = 11;
}

message TradeList {
  repeated Trade trade = 1;
}