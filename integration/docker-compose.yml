services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - POSTGRES_ADDR=postgres:5432
      - REDIS_ADDR=redis:6379
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - ../:/app
    command: air -c .air.toml
    depends_on:
      - redis
      - postgres
    networks:
      - app-network

  matching-engine-integration:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - POSTGRES_ADDR=postgres:5432
      - REDIS_ADDR=redis:6379
    command: ["go", "test", "-v", "./tests/integration_test.go"]
    depends_on:
      - redis
      - postgres
    networks:
      - app-network

  matching-engine-unit-tests:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - POSTGRES_ADDR=postgres:5432
      - REDIS_ADDR=redis:6379
    command: ["go", "test", "-v", "./internal/engine"]
    depends_on:
      - redis
      - postgres
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - ../internal/storage/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge